<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The requested AuraCare page could not be found.">
  <title>Page Not Found | Stackly Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg-main);text-align:center;">
    <section>
      <a href="index.html" class="brand" aria-label="Stackly Health Home" style="justify-content:center;margin-bottom:32px;">
        <img class="logo" src="assets/images/Stackly Logo" alt="Stackly Health">
      </a>
      <p style="color:var(--primary);font-weight:800;font-size:1.1rem;letter-spacing:.12em;">ERROR 404</p>
      <h1 style="font-size:clamp(2.5rem,8vw,5rem);margin:12px auto;">Page not found</h1>
      <p style="max-width:520px;margin:0 auto 28px;color:var(--text-muted);">This destination is not available yet. Please return to the AuraCare home page.</p>
      <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;">
        <button type="button" class="btn btn-outline" id="goBackButton">
          <span>Go Back</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="transform:rotate(180deg)"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
        <a href="index.html" class="btn btn-primary">Return Home</a>
      </div>
    </section>
  </main>
  <script>
    document.getElementById('goBackButton').addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    });
  </script></body>
</html>
